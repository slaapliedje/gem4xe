# GEM4XE.CFG -- what gem4xe should do before it has a screen.
#
# One KEY=VALUE a line.  '#' or ';' starts a comment; case does not
# matter; a key or value gem4xe does not know is ignored, never refused.
# No file, or every line commented out, is the common machine -- which
# is what this is.  Boot to the DOS prompt to change a line.

# VIDEO -- which screen.  AUTO: the VBXE if fitted, else ANTIC.
#   VBXE: 640x240, sixteen colours; refuses to start without one.
#   ANTIC (or SAFE): 320x192, two colours, EVEN IF there is a VBXE --
#   the way out when the display is blank, rolling or out of range.
# VIDEO=AUTO

# MOUSE -- the pointer on the joystick ports.  AUTO is an ST mouse.
#   ST, AMIGA, TRAKBALL (CX80 and CX22 work too), CX77 (Atari's Touch
#   Tablet; TABLET works too), KOALA (a KoalaPad; KOALAPAD works),
#   XEM1 (mouSTer; MOUSTER works), JOY (a joystick: hold it to move the
#   pointer, fire is the click; JOYSTICK works), NONE (the keyboard
#   only).  The boot screen's Pointer line says which one it took: a
#   word it does not know leaves AUTO.  A tablet: the stylus button or the pad's left
#   button is the left click, its right button the right one.
# MOUSE=AUTO

# MOUSEPORT -- which joystick port the mouse is in, 1 or 2.  TWO is the
#   standard and the default: it is where the Atari world wires a mouse,
#   and port 1 is reported to interfere with the keyboard.  A quadrature
#   mouse takes a whole port -- four direction lines, the trigger for the
#   left button, the first paddle line for the right -- so both buttons
#   follow the port.  Only for a machine wired the other way.  A tablet
#   (CX77, KOALA) or a joystick (JOY) is on port 1 unless this says
#   otherwise, as Atari's own tablet software and every game expect.
# MOUSEPORT=2

# CLOCK -- where the time comes from.  AUTO: the chip on an Ultimate
#   1MB or a SIDE, else whatever clock the DOS knows.  DOS: the DOS only.
#   NONE: midnight, 1 January 1980 -- try it if the machine stops before
#   the boot screen.
# CLOCK=AUTO

# SCREENH -- how many of the VBXE's 240 lines to show: 240, 224 or 200.
# TOPMARGIN -- blank lines above the picture, 0 to 32.
#   Both for a television that cuts the top or bottom off: SCREENH makes
#   the picture shorter, TOPMARGIN moves it down.  Try 224 first.
# SCREENH=240
# TOPMARGIN=0
#
# SCREENW -- how WIDE the picture is: 512, 640 or 672.  Not the same
#   picture cropped, the way SCREENH is -- it is a different screen, with
#   more or fewer pixels across, and the desktop lays itself out to it.
#   640 is the VBXE's normal overlay and what gem4xe has always used;
#   672 is every pixel the overlay can show and needs a display that is
#   not cropping the sides; 512 is narrower and safest on a television.
#   Anything else is ignored and you get 640.
# SCREENW=640

# PRINTER -- what a page is written in: NONE, PCL (a laser printer, or
#   Altirra's 825) or PS (PostScript, best to a file).  NONE never waits.
# PRINTTO -- where it goes: P:, or a filename.
# PRINTER=NONE
# PRINTTO=P:

# DESKINF -- where the desktop keeps its layout (Options > Save desktop):
#   the windows, the view, the background, installed programs and icons.
#   Not set: DESKTOP.INF here, beside this file.  A name alone is here
#   too; \DIR\NAME is from the root; D1:\DIR\NAME is on drive D1:.
# DESKINF=DESKTOP.INF

# HIGHRAM -- the banks of 65C816 memory GEM may use, first-last, as $04-$3F
#   or 4-63.  Not set: all the RAM it finds, inside what the Rapidus OS
#   says is high RAM, and never what that OS has given to something else
#   -- the boot screen's Memory line says which banks it took.  For a
#   board where something else lives up there and the OS does not say so.
# HIGHRAM=$04-$EF

# LOOK -- how GEM draws its windows and dialogs.  FLAT: the ST's
#   plain black and white.  3D: the Falcon's raised buttons, grey
#   dialogs and raised window gadgets.  The Control Panel's General
#   module changes it while GEM runs; once saved there, its choice
#   is put back at every boot and wins over this line.
# LOOK=FLAT
